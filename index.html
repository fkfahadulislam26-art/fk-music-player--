<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.json"><title>FK Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:76px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 17px}.top h1{font-size:21px;margin:0}.top button,.more{background:none;border:0;color:#eee;font-size:23px}.tabs{display:flex;overflow:auto;border-bottom:1px solid #292929}.tabs button{min-width:78px;background:none;border:0;color:#999;padding:14px 4px 11px}.tabs .active{color:#ff3b30;border-bottom:2px solid #ff3b30}.actions{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.red{color:#ff3b30}.song{display:grid;grid-template-columns:48px 1fr 34px;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid #1d1d1d}.art{width:48px;height:48px;border-radius:7px;background:linear-gradient(145deg,#ff3b30,#ff9a00);display:grid;place-items:center;font-size:25px}.song b{font-size:15px}.song small{display:block;color:#888;margin-top:5px}.empty{text-align:center;color:#777;padding:100px 20px}.mini{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#171717;border-top:1px solid #333;display:grid;grid-template-columns:45px 1fr 42px 42px;gap:8px;align-items:center;padding:8px 12px;z-index:5}.mini .art{width:45px;height:45px}.mini b{font-size:13px}.mini small{display:block;color:#999}.mini button{background:none;border:0;color:#fff;font-size:20px}.search{padding:12px 18px}.search input{width:100%;padding:12px 16px;border-radius:22px;border:1px solid #333;background:#151515;color:#fff}.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:end;z-index:20}.sheet>div{width:min(520px,100%);background:#181818;border-radius:22px 22px 0 0;padding:10px 18px 25px}.sheet button{width:100%;display:block;padding:17px 4px;text-align:left;background:none;border:0;border-bottom:1px solid #303030;color:#eee}.danger{color:#ff453a!important}.scan{text-align:center;padding:20px}.scan .big{font-size:65px;color:#ff3b30}.scan p{color:#888}.scan .scanbtn{background:#ff3b30;color:#fff;border:0;border-radius:24px;padding:13px 35px}.player{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#343434,#080808 65%);z-index:15;padding:14px 18px 25px;display:flex;flex-direction:column}.player .close{background:none;border:0;color:#fff;font-size:28px;text-align:left}.cover{width:min(320px,72vw);aspect-ratio:1;margin:30px auto 24px;border-radius:8px;background:linear-gradient(145deg,#ff3b30,#ff9800);display:grid;place-items:center;font-size:100px}.pt{text-align:center}.pt h2{margin:6px 0}.pt p{color:#aaa}.range{width:100%;accent-color:#ff3b30}.times{display:flex;justify-content:space-between;color:#888;font-size:11px}.controls{display:flex;justify-content:space-around;align-items:center;margin:22px 0}.controls button{background:none;border:0;color:#fff;font-size:24px}.controls .main{width:62px;height:62px;border-radius:50%;background:#fff;color:#000}.tools{display:flex;justify-content:space-around}.tools button{background:none;border:0;color:#bbb}
</style></head><body><main class="app">
<header class="top"><h1>All songs</h1><div><button id="install">＋</button><button id="search">⌕</button><button id="menu">⋮</button></div></header>
<nav class="tabs"><button class="active" data-t="songs">Songs</button><button data-t="singers">Singers</button><button data-t="albums">Albums</button><button data-t="folders">Folders</button><button data-t="favorites">Favorites</button></nav>
<section id="content"></section>
<div class="mini"><div class="art">♪</div><div><b id="mt">Not playing</b><small id="ma">—</small></div><button id="play">▶</button><button id="next">⏭</button></div></main>
<div id="overlay"></div><audio id="audio"></audio><script src="app.js"></script></body></html>
